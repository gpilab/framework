name: gpi   # Windows — see environment_mac.yml for macOS
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.14
  # C/C++ build dependencies (headers + libs required to compile PyMOD/PYBIND11 extensions)
  - zlib          # cnpy.h (used by Voxel/Array) requires zlib.h
  - fftw          # FFTW3 FFT library (fftw3.lib / fftw3f.lib)
  - eigen         # Eigen3 linear algebra headers
  - qt            # Qt libraries (PyQt5/PyQt6 Python bindings installed via pip)
  - gxx_win-64    # GCC/G++ cross-compiler for Windows (replaces m2w64-toolchain)
  - distutils-activate-mingw  # Activates MinGW as the compiler for setuptools on Python 3.12+
  - pip
  - pip:
    - -r requirements.txt
