name: gpi
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  # C/C++ build dependencies (headers + libs required to compile PyMOD/PYBIND11 extensions)
  - zlib          # cnpy.h (used by Voxel/Array) requires zlib.h
  - fftw          # FFTW3 FFT library (fftw3.lib / fftw3f.lib)
  - eigen         # Eigen3 linear algebra headers
  - pthreads-win32  # POSIX threads on Windows (pthreads.lib)
  - llvm-openmp     # LLVM OpenMP runtime (libomp.dll) for /openmp:llvm — enables collapse, simd reduction, SIMD vectorization
  - pip
  - pip:
    - -r requirements.txt
