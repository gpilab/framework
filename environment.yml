name: gpi
channels:
  - conda-forge
  - nodefaults
dependencies:
  # ── Python ───────────────────────────────────────────────────────────────
  # Python 3.12: newer CUDA torch wheels (cu121+) don't yet ship cp313
  # builds, so 3.13 can leave GPU users stuck on a CUDA build their
  # installed NVIDIA driver doesn't support. 3.12 has full wheel coverage
  # across all CUDA versions setup_conda_env.py may select.
  - python=3.12

  # ── Qt / GUI ──────────────────────────────────────────────────────────────
  - pyqt6           # Qt6 Python bindings — from conda-forge, not pip
  - qtpy>=2.4.0     # version-agnostic Qt binding layer used throughout GPI

  # ── Scientific stack (conda for best binary compatibility on Windows) ─────
  # Force OpenBLAS instead of MKL: conda-forge's mkl package ships its own
  # libiomp5md.dll in Library/bin. On Windows, if numpy (which imports
  # eagerly in gpi/spawn_worker.py) loads that DLL before torch does, torch's
  # own bundled (and ABI-incompatible) libiomp5md.dll in torch/lib never
  # gets loaded — Windows just reuses the already-resident MKL copy for any
  # DLL that imports "libiomp5md.dll" by name. That copy is missing an
  # export fbgemm.dll expects, causing
  # `OSError: [WinError 127] The specified procedure could not be found.`
  # inside GPI_PROCESS worker subprocesses (but NOT in a plain interactive
  # `import torch`, since nothing else claims that DLL name first there).
  # OpenBLAS avoids the whole conflict by not shipping libiomp5md.dll at all.
  - libblas=*=*openblas
  - numpy>=1.26
  - scipy>=1.11
  - matplotlib>=3.8
  - h5py
  - hdf5=2.1        # pin: h5py 3.16.0 wheels are built against HDF5 2.1, not 2.2
  - pillow>=9.1
  - pydicom>=2.4
  - pyqtgraph>=0.13.3

  # ── C++ build tools (needed to compile custom node extensions) ────────────
  - zlib                    # cnpy.h (Voxel/Array) requires zlib
  - fftw                    # FFTW3 (fftw3.lib / fftw3f.lib)
  - eigen                   # Eigen3 header-only linear algebra
  - pybind11>=3.0            # pybind11 for writing C++ nodes
  - gxx_win-64              # MinGW-w64 GCC 15+ cross-compiler
  - distutils-activate-mingw  # routes setuptools to use MinGW on Windows

  # ── pip (always install into the env, not the base) ──────────────────────
  - pip

  # ── pip packages ──────────────────────────────────────────────────────────
  - pip:
    - dill>=0.3.7
    - grpcio>=1.81.1
    - grpcio-tools>=1.81.1
    - multiprocess>=0.70.15
    - pathos>=0.3.1
    - pox>=0.3.2
    - ppft>=1.7.6
    - psutil>=5.9.0
    - PyOpenGL>=3.1.7
    - qimage2ndarray>=1.10.0
    - PyWavelets>=1.1.1
    - torch              # PyTorch — for GPU port support (TorchTensor GPI type)
    - nvidia-ml-py>=12.0.0  # in-process NVML for torch.cuda.utilization() (no-op without an NVIDIA GPU)
    # Install GPI itself in editable mode after env creation:
    #   conda env create -f environment.yml
    #   conda activate gpi
    #   pip install -e .
    #   gpi_init
